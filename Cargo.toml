[features]
default = ["std", "frame"]
alloc = ["libm", "mediaframe/alloc"]
std = ["thiserror/default", "mediaframe/std"]

# Semver-EXEMPT, repository-internal tier. Exposes a curated `#[doc(hidden)]`
# re-export shim (`pixon::bench_internals`) over the crate-private `row`
# kernels so this repo's own Criterion benches (`benches/*.rs`) can measure them
# directly after the 0.2 surface cut made `row` `pub(crate)`. It carries NO
# stability guarantee and is not part of the public API — external consumers
# must use the `Convert` tier or `MixedSinker` + the `{fmt}_to` walkers. Enable
# it only for `cargo bench` (see `.github/workflows/benchmark.yml`).
unstable-bench-internals = []

frame = [
  "mediaframe/frame",
  "yuv-planar",
  "yuv-semi-planar",
  "yuva",
  "yuv-packed",
  "yuv-444-packed",
  "y2xx",
  "v210",
  "rgb",
  "rgb-float",
  "rgb-legacy",
  "gbr",
  "gray",
  "bayer",
  "xyz",
  "mono",
]

yuv-planar      = ["mediaframe/yuv-planar"]
yuv-semi-planar = ["mediaframe/yuv-semi-planar"]
yuva            = ["mediaframe/yuva", "yuv-planar"]
yuv-packed      = ["mediaframe/yuv-packed"]
yuv-444-packed  = ["mediaframe/yuv-444-packed"]
y2xx            = ["mediaframe/y2xx"]
v210            = ["mediaframe/v210"]
rgb             = ["mediaframe/rgb"]
rgb-float       = ["mediaframe/rgb-float"]
rgb-legacy      = ["mediaframe/rgb-legacy"]
gbr             = ["mediaframe/gbr"]
gray            = ["mediaframe/gray"]
bayer           = ["mediaframe/bayer"]
xyz             = ["mediaframe/xyz"]
mono            = ["mediaframe/mono"]

[dependencies]
derive_more = { version = "2", default-features = false, features = ["display", "is_variant", "try_unwrap", "unwrap"] }
half = { version = "2", default-features = false }
thiserror = { version = "2", default-features = false }
libm = { version = "0.2", optional = true }
mediaframe = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = "0.8"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
  # Testing / coverage helpers. These are set via `RUSTFLAGS='--cfg ...'`
  # in CI to force the dispatcher down a specific path so lower‑tier
  # kernels and the scalar fallback get coverage on runners that would
  # otherwise always pick the top tier.
  'cfg(pixon_force_scalar)',
  'cfg(pixon_disable_avx512)',
  'cfg(pixon_disable_avx2)',
] }
