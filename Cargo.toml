[package]
name = "pixon"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/findit-studio/pixon"
homepage = "https://github.com/findit-studio/pixon"
documentation = "https://docs.rs/pixon"
readme = "README.md"
description = "SIMD-dispatched color conversion for the FFmpeg AVPixelFormat space: one-call decode of validated source frames to RGB / RGBA / Luma / HSV, fused resampling while converting, colorimetry-honest matrices and chroma siting, no_std-friendly."
keywords = ["color-conversion", "yuv", "rgb", "simd", "video"]
categories = ["multimedia", "multimedia::video", "multimedia::images", "no-std", "no-std::no-alloc"]
license = "GPL-3.0-or-later"
rust-version = "1.95.0"
exclude = ["src/resample/pil_goldens.rs"]

